# Memory section
MEMORY {
    ZP:		    start = $0000, size = $0100, type = rw;
    STACK:      start = $0100, size = $0100, type = rw;
    RAM:        start = $0200, size = $7D00, type = rw;
    IO:         start = $7F00, size = $0100, type = rw;
    ROM:        start = $8000, size = $5C00, type = ro, fill = yes, file = %O;
	BASROM:		start = $DC00, size = $2400, type = ro, fill = yes, file = %O;
    MONITOR:    start = $FF00, size = $FA,   type = ro, fill = yes, file = %O;
    RSTVECTORS: start = $FFFA, size = 6,     type = ro, fill = yes, file = %O;
	DUMMY:		start = $0000, size = $00FF, file = "";		# from msbasic ???
}

# Segments section
SEGMENTS {
    ZEROPAGE:	    load = ZP,          type = zp;
    IO:             load = IO,          type = rw, optional = yes;
    HEADER:         load = ROM,         type = ro, optional = yes;
    BIOS:           load = ROM,         type = ro, optional = yes;  #need to remove when I merge the BIOS
	BASHEADER:		load = BASROM,		type = ro; 
	VECTORS:		load = BASROM,		type = ro;
	KEYWORDS:		load = BASROM,		type = ro;
	ERROR:			load = BASROM,		type = ro;
	CODE:			load = BASROM,		type = ro;
	CHRGET:			load = BASROM,		type = ro;
	INIT:			load = BASROM,		type = ro;
	EXTRA:			load = BASROM,		type = ro;
    WOZMON:         load = MONITOR,     type = ro, optional = yes;
    RESETVECTORS:   load = RSTVECTORS,  type = ro, optional = yes;  #need to remove when I merge the BIOS
	DUMMY:			load = DUMMY; 		# don't include - from msbasic ???
}